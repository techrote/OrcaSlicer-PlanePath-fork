name: PlanePath Windows x64 Test Build

# Opt-in build for producing a Windows test executable without invoking the
# complete upstream multi-platform release matrix.
on:
  push:
    branches:
      - 'test-build/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: planepath-windows-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build-script:
    name: Validate Windows build script
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
      - name: Run Windows build script tests
        shell: powershell
        run: .\scripts\test_build_win.ps1

  build-windows-x64:
    name: Build Windows x64 portable and installer
    needs: validate-build-script
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: false
      force-build: false
    secrets: inherit

  unit-tests-windows-x64:
    name: PlanePath and OrcaSlicer Windows x64 tests
    needs: build-windows-x64
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64
